name: Auto Update Sports BLV Playlist

on:
  schedule:
    # Tự động chạy mỗi ngày lúc 06:00 và 18:00 UTC (13:00 và 01:00 giờ VN)
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub bất kỳ lúc nào

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run sports playlist update
        run: |
          python scripts/update.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Auto update Vietnamese BLV playlists, categories, and direct files [skip ci]"
            git push origin main
          fi
